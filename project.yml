:project:
  :name: "audio_buffer"
  :which_ceedling: gem
  :ceedling_version: 1.1.6
  :use_mocks: FALSE
  :use_test_preprocessor: :none
  :use_backtrace: :simple
  :build_root: build
  :test_file_prefix: test_
  :default_tasks:
    - test:all
  :test_threads: 8
  :compile_threads: 8
  :release_build: FALSE

:mixins:
  :enabled: []
  :load_paths: []

:test_build:
  :use_assembly: FALSE

:release_build:
  :output: audio_buffer.out
  :use_assembly: FALSE
  :artifacts: []

:plugins:
  :load_paths: []
  :enabled:
    - report_tests_pretty_stdout

:paths:
  :test:
    - +:test/**
    - -:test/support
  :source:
    - src/**
  :include:
    - inc/**
  :support: []
  :libraries: []

:files:
  :test: []
  :source: []

:defines:
  :test:
    - TEST
  :release: []
